[workspace]
members = [
  "crates/zalo-types",
  "crates/zalo-sdk",
  "crates/zalo-bot",
  "crates/zalo-http",
  "examples/bot-axum",
]
exclude = [
  "examples/miniapp-leptos",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["RAprogramm <andrey.rozanov.vl@gmail.com>"]
description = "Zalo bot platform implemented in Rust"

[workspace.dependencies]
zalo-types = { path = "crates/zalo-types" }
zalo-sdk = { path = "crates/zalo-sdk" }
zalo-bot = { path = "crates/zalo-bot" }
zalo-http = { path = "crates/zalo-http" }

axum = { version = "0.8", features = ["macros"] }
config = "0.14"
figment = { version = "0.10", features = ["env", "toml"] }
hex = "0.4"
hmac = "0.12"
masterror = "0.27"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
