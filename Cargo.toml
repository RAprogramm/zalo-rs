[workspace]
members = [
  "crates/zalo-types",
  "crates/zalo-sdk",
  "crates/zalo-bot",
  "examples/miniapp-leptos",
  "examples/bot-axum",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.2.0"
authors = ["RAprogramm <andrey.rozanov.vl@gmail.com>"]
description = "Zalo bot platform implemented in Rust"

[workspace.dependencies]
figment = { version = "0.10", features = ["env", "toml"] }
masterror = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
